version: "3.9"

services:
  db:
    image: postgres:15
    container_name: invoiceflow-db
    restart: always
    environment:
      POSTGRES_USER: invoice_user
      POSTGRES_PASSWORD: invoice_pass
      POSTGRES_DB: invoiceflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: invoiceflow-api
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://invoice_user:invoice_pass@db:5432/invoiceflow
    ports:
      - "8000:8000"

volumes:
  postgres_data: